<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>bSim</title>
    <link rel="icon" type="image/svg+xml" href="assets/bSim-logo-f-c-32.svg">
    <link rel="stylesheet" href="css/style.css">
    <script>window.EXPECTED_BSIM_VERSION = "1.24.38";</script>
</head>

<body oncontextmenu="return false;">
    <div id="top-reveal" class="edge-reveal top">▼</div>
    <nav id="top-nav">
        <div class="nav-brand" style="display: flex; align-items: center;">
            <img src="assets/bSim-logo-big.svg" alt="bSim Logo" style="height: 31.25px; margin-right: 8px; transition: transform 0.2s ease;">
            <span style="font-size:10px; color:var(--wire-on); padding-top: 4px;">v1.24.38</span>
        </div>

        <div class="menu-item has-sub">File
            <div class="sub-menu">
                <div class="menu-item" onclick="Sim.uiNewProject()">New Workspace</div>
                <div class="menu-item" onclick="Sim.uiNewChip()">Clear Board</div>
                <div class="menu-item" onclick="ProjectManager.importProject()">Load .bsim</div>
                <div class="menu-item" onclick="toggleSubMenu(this, event)">Export .bsim
                    <div class="sub-menu" style="padding: 8px; width: 150px; cursor: default;" onclick="event.stopPropagation()">
                        <div style="font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; font-weight: bold;">Filename:</div>
                        <input type="text" id="export-bsim-name" value="bSim_Project" style="width: 100%; box-sizing: border-box; background: #111; color: #0f5; border: 1px solid #334; padding: 6px; font-size: 11px; margin-bottom: 6px; outline: none; border-radius: 4px; font-family: 'JetBrains Mono', monospace;" onkeydown="if(event.key === 'Enter') { ProjectManager.exportProject(this.value); this.parentElement.style.display='none'; }" onfocus="this.closest('.menu-item.has-sub').classList.add('keep-open')" onblur="this.closest('.menu-item.has-sub').classList.remove('keep-open')">
                        <div class="menu-item" style="text-align: center; background: #252530; border-radius: 4px; padding: 6px; color: #fff; font-weight: bold;" onclick="ProjectManager.exportProject(document.getElementById('export-bsim-name').value); this.parentElement.style.display='none';">Save .bsim</div>
                    </div>
                </div>
                <div class="menu-item" onclick="toggleSubMenu(this, event)">Export PNG
                    <div class="sub-menu" style="padding: 8px; width: 150px; cursor: default;" onclick="event.stopPropagation()">
                        <div style="font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; font-weight: bold;">Filename:</div>
                        <input type="text" id="export-png-name" value="bSim_Diagram" style="width: 100%; box-sizing: border-box; background: #111; color: #0f5; border: 1px solid #334; padding: 6px; font-size: 11px; margin-bottom: 6px; outline: none; border-radius: 4px; font-family: 'JetBrains Mono', monospace;" onkeydown="if(event.key === 'Enter') { ProjectManager.exportImage(this.value); this.parentElement.style.display='none'; }" onfocus="this.closest('.menu-item.has-sub').classList.add('keep-open')" onblur="this.closest('.menu-item.has-sub').classList.remove('keep-open')">
                        <div class="menu-item" style="text-align: center; background: #252530; border-radius: 4px; padding: 6px; color: #fff; font-weight: bold;" onclick="ProjectManager.exportImage(document.getElementById('export-png-name').value); this.parentElement.style.display='none';">Save PNG</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="menu-item has-sub">Edit
            <div class="sub-menu">
                <div class="menu-item" id="btn-undo" onclick="History.undo()">Undo (Ctrl+Z)</div>
                <div class="menu-item" id="btn-redo" onclick="History.redo()">Redo (Ctrl+Y)</div>
                <div class="menu-item" onclick="Sim.showPrefs()">Preferences</div>
            </div>
        </div>

        <div class="menu-item has-sub">Tools
            <div class="sub-menu">
                <div class="menu-item" onclick="Sim.uiSaveAsGate()" style="color:#ffca28; font-weight:bold;">Save Chip</div>
                <div class="menu-item" onclick="Analyzer.generateTruthTable()">Logic Table</div>
                <div class="menu-item" onclick="SynthUI.open()" style="color:#a855f7;">Synthesize</div>
                <div class="menu-item" onclick="Sim.runWasmParityCheck()" style="color:var(--wire-on);">Parity Diagnostics
                </div>
                <div class="menu-item" onclick="Analyzer.generateBOM()">Hardware BOM</div>
            </div>
        </div>

        <div class="menu-item has-sub">Help
            <div class="sub-menu">
                <div class="menu-item" onclick="TutorialEngine.showMenu()" style="color:#00ffaa;">Instructor</div>
            </div>
        </div>

        <div style="flex-grow:1"></div>
        <span id="btn-exit-chip" style="display:none; color:#fbbf24; font-weight:bold"
            onclick="Sim.uiExitChipEdit()">Exit Chip Edit</span>
        <span onclick="Sim.uiQuit()"
            style="color:#ff4757; font-size: 11px; padding: 6px 12px; cursor:pointer;">Quit</span>
        <div id="btn-hide-nav" class="hide-btn" title="Auto-Hide Nav">▲</div>
    </nav>

    <div id="tab-bar">
        <div class="tab-btn" onclick="Sim.uiNewTab()">+</div>
    </div>

    <div id="main">
        <!-- 
            @ARCH: VIEWPORT_CONTAINER
            @IO: INTERACTION_SURFACE
            @INTENT: Host the logical simulation layers (Grid, Nodes, Wires) and capture user input for translation.
        -->
        <div id="workspace">
            <div id="grid-layer"></div>
            <div id="scene"></div>
            <svg id="svg-layer"></svg>
        </div>
    </div>

    <!-- 
        @ARCH: LIBRARY_VIEW
        @IO: COMPONENT_INJECTION
        @INTENT: Display the available component library and enable drag-and-drop or click-to-place instantiation.
    -->
    <footer id="bottom-nav">
        <div id="btn-hide-footer" class="hide-btn" title="Auto-Hide Library">▼</div>
        <div id="chip-lib" style="display:flex; gap:10px; flex-grow:1; align-items:center; margin-left: 10px;">
            <span class="status-chip" onclick="Sim.addNode('NAND')">NAND</span>
        </div>
    </footer>
    <div id="bottom-reveal" class="edge-reveal bottom">▲</div>

    <!-- Overlay / Modal -->
    <div id="ui-overlay">
        <div class="ui-modal" id="modal-body">
            <h3 id="ui-title">Title</h3>
            <p id="ui-msg" style="font-size:14px; color:#aaa; margin-bottom:25px; line-height:1.6"></p>
            <div id="ui-input-container">
                <input type="text" id="ui-input-el" class="ui-input" spellcheck="false" autocomplete="off">
            </div>
            <div class="ui-actions" id="ui-buttons" style="display:flex; gap:12px; justify-content:flex-end"></div>
        </div>
    </div>

    <!-- Floating UI Panels -->
    <div id="tutorial-panel"
        style="position:fixed; bottom:60px; right:20px; background:var(--panel); border:1px solid var(--border); padding:20px; border-radius:12px; width:300px; display:none; z-index:2000;">
    </div>

    <!-- Core Modules -->
    <script src="js/history.js"></script>
    <script src="js/view.js"></script>

    <!-- Analysis & Project Modules -->
    <script src="js/modules/persistence.js"></script>
    <script src="js/modules/analyzer.js"></script>
    <script src="js/modules/node_renderer.js"></script>
    <script src="js/modules/wire_renderer.js"></script>
    <!-- wasm bridge -->
    <script type="module">
        import WasmEngine from './js/modules/wasm_bridge.js';
        window.WasmEngine = WasmEngine; // Expose to global scope for dev console access
        WasmEngine.init();
    </script>

    <script src="js/modules/interaction.js"></script>
    <script src="js/modules/tutorial.js"></script>
    <script src="js/modules/synth_ui.js"></script>
    <script src="js/modules/debug_terminal.js"></script>

    <!-- Core Engine -->
    <script src="js/synthesizer.js"></script>
    <script src="js/sim.js"></script>
    <script src="js/app.js"></script>

    <script>
        // [AUDIT: v1.24.23 | SEC_ARCH_LEAD] - Updated sub-menu toggle logic to use flex display and prevent inline style lock on siblings.
        function toggleSubMenu(el, e) {
            const sm = el.querySelector('.sub-menu');
            const isVisible = sm.style.display === 'block' || sm.style.display === 'flex';
            document.querySelectorAll('.sub-menu').forEach(s => {
                if (s !== sm && !s.contains(sm)) s.style.display = '';
            });
            sm.style.display = isVisible ? 'none' : 'flex';
            if (e) e.stopPropagation();
        }
    </script>
</body>

</html>
